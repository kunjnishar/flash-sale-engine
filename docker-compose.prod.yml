services:
  postgres:
    image: postgres:16-alpine
    container_name: flashsale-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: flashuser
      POSTGRES_PASSWORD: flashpass
      POSTGRES_DB: flashdb
    volumes:
      - flashsale-postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashuser -d flashdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - flashsale-prod-network

  redis:
    image: redis:7-alpine
    container_name: flashsale-redis-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - flashsale-prod-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flashsale-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashdb
      SPRING_DATASOURCE_USERNAME: flashuser
      SPRING_DATASOURCE_PASSWORD: flashpass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      REDISSON_ADDRESS: redis://redis:6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - flashsale-prod-network

volumes:
  flashsale-postgres-prod-data:
    driver: local

networks:
  flashsale-prod-network:
    driver: bridge